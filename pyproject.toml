[project]
name = "sommer"
version = "0.1.0"
description = "Fragment ion intensity prediction for CID MS/MS"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "biopython>=1.88",
    "catboost>=1.2.10",
    "ipykernel>=7.2.0",
    "lightgbm>=4.6.0",
    "matplotlib>=3.10.9",
    "optuna",
    "pandas>=3.0.3",
    "pre-commit>=4.7.0",
    "pyarrow>=24.0.0",
    "scikit-learn>=1.9.0",
    "torch>=2.12.0",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "nbconvert>=7.17.1",
    "nbformat>=5.10.4",
    "openpyxl>=3.1.5",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sommer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
